<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H2برو - النظام المحاسبي المتكامل</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a}.top{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900}.brand b{color:#60a5fa}.wrap{max-width:1100px;margin:auto;padding:18px}.card,.menu{background:#fff;border-radius:12px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{text-align:center;background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px #0001}.v{font-size:22px;font-weight:900}button{border:0;border-radius:8px;padding:10px 15px;margin:3px;font-weight:700;cursor:pointer}.p{background:#0f172a;color:#fff}.s{background:#e2e8f0}.d{background:#b91c1c;color:#fff}.ok{background:#166534;color:#fff}input,select{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:8px;font:inherit;margin:4px 0 10px}.field label{font-weight:700;display:block}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:right}.low{color:#b91c1c;font-weight:800}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e293b);padding:18px}.loginbox{background:#fff;padding:28px;border-radius:18px;width:100%;max-width:390px}.logo{width:60px;height:60px;background:#0f172a;color:#fff;border-radius:15px;display:grid;place-items:center;font-size:23px;font-weight:900;margin:auto}.hide{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:9px;display:none;z-index:9}@media(max-width:700px){.grid{grid-template-columns:1fr}.top div:last-child{width:100%}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="logo">H2</div><h1 style="text-align:center">H2برو</h1><p style="text-align:center;color:#64748b">النظام المحاسبي المتكامل</p><div class="field"><label>السنة المالية</label><input id="year" type="number" value="2026"></div><div class="field"><label>رقم المستخدم</label><input id="uid" value="1"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" value="1234"></div><button class="p" style="width:100%" onclick="login()">🚀 تسجيل الدخول</button></div></div><div id="app" class="hide"><div class="top"><div class="brand">H2<b>برو</b></div><div><span id="session"></span><button class="s" onclick="home()">🏠 الرئيسية</button><button class="s" onclick="dashboard()">📊 لوحة التحكم</button><button class="d" onclick="logout()">🚪 خروج</button></div></div><main class="wrap" id="view"></main></div><div id="toast" class="toast"></div><script>
const key='H2PRO_ANDROID_DB_V4';function fresh(){return{company:{name:'شركتي التجارية',phone:'',address:'صنعاء، اليمن'},users:[{id:'1',name:'المدير',password:'1234',role:'admin'},{id:'2',name:'محاسب',password:'1234',role:'user'}],accounts:[['101','الصندوق','أصول'],['102','البنك','أصول'],['103','المخزون','أصول'],['201','الموردون','خصوم'],['301','رأس المال','حقوق ملكية'],['401','المبيعات','إيرادات'],['501','المشتريات','مصروفات'],['502','مصاريف تشغيلية','مصروفات']],inventory:[{id:1,code:'P001',name:'منتج 1',buy:100,sale:150,min:10,qty:50},{id:2,code:'P002',name:'منتج 2',buy:200,sale:300,min:5,qty:8}],customers:[{id:1,name:'عميل 1',phone:''}],suppliers:[{id:1,name:'مورد 1',phone:''}],purchases:[],sales:[],journals:[],seq:1}}let DB=JSON.parse(localStorage.getItem(key)||'null')||fresh();function save(){localStorage.setItem(key,JSON.stringify(DB))}function n(x){return Number(x)||0}function fmt(x){return n(x).toLocaleString('ar-YE',{minimumFractionDigits:2,maximumFractionDigits:2})}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}function login(){let u=DB.users.find(x=>x.id===uid.value.trim()&&x.password===pass.value.trim());if(!u)return toast('❌ بيانات الدخول غير صحيحة');sessionStorage.setItem('h2s',JSON.stringify({name:u.name,year:year.value}));document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');document.getElementById('session').textContent=u.name+' | '+year.value;dashboard()}function logout(){sessionStorage.removeItem('h2s');location.reload()}function nav(title,body){view.innerHTML='<h2>'+title+'</h2>'+body+'<br><button class="s" onclick="home()">← رجوع</button>'}function home(){let m=[['📒','دليل الحسابات','accounts()'],['📝','قيد يومي جديد','journalForm()'],['📖','عرض القيود','journals()'],['📦','المخزون','inventory()'],['🧾','فاتورة شراء','purchase()'],['🛒','فاتورة بيع','sale()'],['📊','ميزان المراجعة','trial()'],['💰','قائمة الدخل','income()'],['👥','العملاء','customers()'],['🏢','الموردون','suppliers()'],['⚙️','الإعدادات','settings()']];view.innerHTML='<h2>📋 القائمة الرئيسية</h2><div class="stats">'+m.map(x=>`<div class="menu" style="text-align:center;cursor:pointer" onclick="${x[2]}"><div style="font-size:30px">${x[0]}</div><b>${x[1]}</b></div>`).join('')+'</div>'}function dashboard(){let inv=DB.inventory.reduce((s,x)=>s+x.qty*x.buy,0),cash=DB.journals.reduce((s,j)=>s+j.details.reduce((a,d)=>a+n(d.debit)-n(d.credit)*(d.account==='101'?1:0),0),0);let low=DB.inventory.filter(x=>x.qty<=x.min).length;view.innerHTML='<h2>📊 لوحة التحكم</h2><div class="stats">'+[['الحسابات',DB.accounts.length],['الأصناف',DB.inventory.length],['المشتريات',DB.purchases.length],['المبيعات',DB.sales.length],['القيود',DB.journals.length],['قيمة المخزون',fmt(inv)],['الصندوق',fmt(cash)],['أصناف منخفضة',low?'⚠️ '+low:'✅ 0']].map(x=>`<div class="stat"><div class="v">${x[1]}</div><div>${x[0]}</div></div>`).join('')+'</div><div class="card"><h3>⚡ وصول سريع</h3><button class="p" onclick="journalForm()">قيد يومي</button><button class="p" onclick="purchase()">فاتورة شراء</button><button class="p" onclick="sale()">فاتورة بيع</button><button class="p" onclick="trial()">ميزان المراجعة</button></div>'}function accounts(){let h='<button class="p" onclick="addAccount()">➕ إضافة حساب</button><table><tr><th>الكود</th><th>الاسم</th><th>النوع</th></tr>';DB.accounts.forEach(a=>h+=`<tr><td>${a[0]}</td><td>${esc(a[1])}</td><td>${a[2]}</td></tr>`);nav('📒 دليل الحسابات',h+'</table>')}function addAccount(){nav('➕ إضافة حساب','<div class="field"><label>الكود</label><input id="ac"></div><div class="field"><label>الاسم</label><input id="an"></div><div class="field"><label>النوع</label><select id="at"><option>أصول</option><option>خصوم</option><option>حقوق ملكية</option><option>إيرادات</option><option>مصروفات</option></select></div><button class="p" onclick="saveAcc()">💾 حفظ</button>')}function saveAcc(){if(!ac.value||!an.value)return toast('⚠️ أدخل البيانات');if(DB.accounts.some(a=>a[0]===ac.value))return toast('⚠️ الكود موجود');DB.accounts.push([ac.value,an.value,at.value]);save();accounts()}function accOptions(){return DB.accounts.map(a=>`<option value="${a[0]}">${a[0]} - ${esc(a[1])}</option>`).join('')}function journalForm(){nav('📝 قيد يومي جديد','<div id="rows"><div class="card row"><select class="ja">'+accOptions()+'</select><input class="jd" placeholder="البيان"><input class="jdr" type="number" min="0" placeholder="مدين"><input class="jcr" type="number" min="0" placeholder="دائن"></div></div><button class="s" onclick="addJRow()">➕ سطر</button><input id="jdesc" placeholder="البيان العام"><input id="jdate" type="date" value="'+new Date().toISOString().slice(0,10)+'"><button class="p" onclick="saveJournal()">💾 حفظ القيد</button>')}function addJRow(){rows.insertAdjacentHTML('beforeend','<div class="card row"><select class="ja">'+accOptions()+'</select><input class="jd" placeholder="البيان"><input class="jdr" type="number" min="0" placeholder="مدين"><input class="jcr" type="number" min="0" placeholder="دائن"></div>')}function saveJournal(){let rs=[...document.querySelectorAll('.row')],d=[],dr=0,cr=0;rs.forEach(r=>{let x=n(r.querySelector('.jdr').value),y=n(r.querySelector('.jcr').value);if(x||y){if(x&&y)return;dr+=x;cr+=y;d.push({account:r.querySelector('.ja').value,debit:x,credit:y,description:r.querySelector('.jd').value||jdesc.value})}});if(!jdesc.value||d.length<2)return toast('⚠️ أدخل البيان وسطرين على الأقل');if(Math.abs(dr-cr)>.01)return toast('❌ القيد غير متوازن');DB.journals.push({id:Date.now(),no:DB.seq++,date:jdate.value,description:jdesc.value,total:dr,details:d});save();toast('✅ تم حفظ القيد');journals()}function journals(){let h=DB.journals.length?'<table><tr><th>الرقم</th><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr>'+DB.journals.slice().reverse().map(j=>`<tr><td>${j.no}</td><td>${j.date}</td><td>${esc(j.description)}</td><td>${fmt(j.total)}</td></tr>`).join('')+'</table>':'<div class="card">لا توجد قيود</div>';nav('📖 القيود اليومية',h)}function inventory(){let h='<button class="p" onclick="addItem()">➕ إضافة صنف</button><table><tr><th>الكود</th><th>الاسم</th><th>شراء</th><th>بيع</th><th>الكمية</th><th>الحالة</th></tr>'+DB.inventory.map(x=>`<tr><td>${x.code}</td><td>${esc(x.name)}</td><td>${fmt(x.buy)}</td><td>${fmt(x.sale)}</td><td>${x.qty}</td><td class="${x.qty<=x.min?'low':''}">${x.qty<=x.min?'منخفض':'طبيعي'}</td></tr>`).join('')+'</table>';nav('📦 المخزون',h)}function addItem(){nav('➕ إضافة صنف','<input id="ic" placeholder="الكود"><input id="inm" placeholder="اسم الصنف"><div class="grid"><input id="ib" type="number" placeholder="سعر الشراء"><input id="is" type="number" placeholder="سعر البيع"><input id="im" type="number" placeholder="الحد الأدنى"><input id="iq" type="number" placeholder="الكمية"></div><button class="p" onclick="saveItem()">💾 حفظ</button>')}function saveItem(){if(!ic.value||!inm.value)return toast('⚠️ أدخل الكود والاسم');DB.inventory.push({id:Date.now(),code:ic.value,name:inm.value,buy:n(ib.value),sale:n(is.value),min:n(im.value),qty:n(iq.value)});save();inventory()}function people(kind){return kind==='c'?DB.customers:DB.suppliers}function peoplePage(kind){let arr=people(kind),title=kind==='c'?'العملاء':'الموردون';nav((kind==='c'?'👥 ':'🏢 ')+title,'<button class="p" onclick="addPerson(\''+kind+'\')">➕ إضافة</button><table><tr><th>الاسم</th><th>الهاتف</th></tr>'+arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td></tr>`).join('')+'</table>')}function customers(){peoplePage('c')}function suppliers(){peoplePage('s')}function addPerson(k){nav('➕ إضافة '+(k==='c'?'عميل':'مورد'),'<input id="pn" placeholder="الاسم"><input id="pp" placeholder="الهاتف"><button class="p" onclick="savePerson(\''+k+'\')">💾 حفظ</button>')}function savePerson(k){if(!pn.value)return toast('⚠️ أدخل الاسم');people(k).push({id:Date.now(),name:pn.value,phone:pp.value});save();peoplePage(k)}function itemSelect(cls){return DB.inventory.map(x=>`<option value="${x.id}">${esc(x.name)} (المتاح ${x.qty})</option>`).join('')}function partySelect(k){let a=people(k);return a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}function sale(){nav('🛒 فاتورة بيع','<select id="sc">'+partySelect('c')+'</select><select id="si">'+itemSelect()+'</select><div class="grid"><input id="sq" type="number" value="1" min="1" placeholder="الكمية"><input id="sp" type="number" min="0" placeholder="سعر البيع"><input id="spaid" type="number" min="0" placeholder="المدفوع"></div><button class="p" onclick="saveSale()">💾 حفظ وترحيل</button>')}function saveSale(){let it=DB.inventory.find(x=>x.id==si.value),q=n(sq.value),price=n(sp.value);if(!it||q<=0||it.qty<q||price<=0)return toast('❌ تحقق من الصنف والكمية والسعر');it.qty-=q;DB.sales.push({id:Date.now(),customerId:n(sc.value),items:[{itemId:it.id,qty:q,price}],total:q*price,date:new Date().toISOString().slice(0,10)});save();toast('✅ تم حفظ فاتورة البيع');dashboard()}function purchase(){nav('🧾 فاتورة شراء','<select id="ps">'+partySelect('s')+'</select><select id="pi">'+itemSelect()+'</select><div class="grid"><input id="pq" type="number" value="1" min="1" placeholder="الكمية"><input id="ppx" type="number" min="0" placeholder="سعر الشراء"><input id="ppaid" type="number" min="0" placeholder="المدفوع"></div><button class="p" onclick="savePurchase()">💾 حفظ وترحيل</button>')}function savePurchase(){let it=DB.inventory.find(x=>x.id==pi.value),q=n(pq.value),price=n(ppx.value);if(!it||q<=0||price<=0)return toast('❌ تحقق من البيانات');it.qty+=q;it.buy=price;DB.purchases.push({id:Date.now(),supplierId:n(ps.value),items:[{itemId:it.id,qty:q,price}],total:q*price,date:new Date().toISOString().slice(0,10)});save();toast('✅ تم حفظ فاتورة الشراء');dashboard()}function trial(){let b={};DB.accounts.forEach(a=>b[a[0]]={name:a[1],dr:0,cr:0});DB.journals.forEach(j=>j.details.forEach(d=>{if(b[d.account]){b[d.account].dr+=n(d.debit);b[d.account].cr+=n(d.credit)}}));let h='<table><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>';Object.keys(b).forEach(c=>h+=`<tr><td>${c} - ${esc(b[c].name)}</td><td>${fmt(b[c].dr)}</td><td>${fmt(b[c].cr)}</td><td>${fmt(Math.abs(b[c].dr-b[c].cr))}</td></tr>`);nav('📊 ميزان المراجعة',h+'</table>')}function income(){let inc=0,exp=0;DB.journals.forEach(j=>j.details.forEach(d=>{let a=DB.accounts.find(x=>x[0]===d.account);if(a?.[2]==='إيرادات')inc+=n(d.credit)-n(d.debit);if(a?.[2]==='مصروفات')exp+=n(d.debit)-n(d.credit)}));nav('💰 قائمة الدخل',`<div class="stats"><div class="stat"><div class="v">${fmt(inc)}</div>الإيرادات</div><div class="stat"><div class="v">${fmt(exp)}</div>المصروفات</div><div class="stat"><div class="v">${fmt(inc-exp)}</div>صافي الربح</div></div>`)}function settings(){nav('⚙️ الإعدادات','<input id="cn" value="'+esc(DB.company.name)+'" placeholder="اسم الشركة"><input id="cp" value="'+esc(DB.company.phone)+'" placeholder="الهاتف"><input id="ca" value="'+esc(DB.company.address)+'" placeholder="العنوان"><button class="p" onclick="saveSettings()">💾 حفظ</button><hr><button class="d" onclick="resetDB()">🗑️ مسح جميع البيانات</button>')}function saveSettings(){DB.company={name:cn.value,phone:cp.value,address:ca.value};save();toast('✅ تم الحفظ')}function resetDB(){if(confirm('تأكيد مسح كل البيانات؟')){localStorage.removeItem(key);location.reload()}}if(sessionStorage.getItem('h2s')){let s=JSON.parse(sessionStorage.getItem('h2s'));login()}else{home()}
</script></body></html>
